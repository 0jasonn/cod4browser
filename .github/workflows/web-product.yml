name: web-product

on:
  pull_request:
  push:
    branches: [web-port, "codex/**"]

jobs:
  web:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: npm.cmd ci
      - name: Install Chromium
        run: npx.cmd playwright install chromium
      - name: Bootstrap pinned web toolchain
        shell: powershell
        run: tools/bootstrap_web_toolchain.ps1
      - name: Build production
        run: npm.cmd run build:web
      - name: Enforce production artifact boundary
        run: npm.cmd run check:web:product
      - name: Test production boot and protocol surface
        run: npm.cmd run test:browser:product
      - name: Build diagnostics
        run: npm.cmd run build:web:diagnostics
      - name: Test diagnostic smoke tier
        shell: powershell
        run: |
          $env:KISAK_WEB_TEST_PORT = '8017'
          npm.cmd run test:browser
      - name: Test diagnostic remainder tier
        shell: powershell
        run: |
          $env:KISAK_WEB_TEST_PORT = '8017'
          npm.cmd run test:browser:remainder

  portable-native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable native tests
        run: cmake -S . -B build/native-ci -DKISAK_PORTABLE_TESTS_ONLY=ON
      - name: Build portable native tests
        run: cmake --build build/native-ci --config Release --parallel 2
      - name: Run portable native tests
        run: ctest --test-dir build/native-ci -C Release --output-on-failure
