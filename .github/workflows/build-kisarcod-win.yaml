name: Windows CMake DirectX Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build with DirectX SDK
    runs-on: windows-2022

    strategy:
      matrix:
        config: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download pinned DirectX SDK package
        shell: powershell
        run: |
          $pin = Get-Content -Raw tools/native_toolchain.json | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'dxsdk.nupkg'
          $sdk = Join-Path $env:RUNNER_TEMP 'dxsdk'
          Invoke-WebRequest -UseBasicParsing -Uri "https://www.nuget.org/api/v2/package/$($pin.d3dxPackage)/$($pin.d3dxVersion)" -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $pin.d3dxSha256) {
              throw 'D3DX package hash mismatch.'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, $sdk)
          "DXSDK_DIR=$sdk/build/native" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install latest CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake ${{ matrix.config }}
        run: |
          pushd
          mkdir build-${{ matrix.config }}
          cd build-${{ matrix.config }}
          cmake -G "Visual Studio 17 2022" -A Win32 -DDXSDK_DIR="${{ env.DXSDK_DIR }}" -DCICD=1 -DKISAK_COPY_RUNTIME_DLLS=OFF -DCMAKE_BUILD_TYPE=${{ matrix.config }} ..
          popd

      - name: Build ${{ matrix.config }}
        run: |
          pushd
          cmake --build build-${{ matrix.config }} --config ${{ matrix.config }} --target "KisakCOD-sp"
          cmake --build build-${{ matrix.config }} --config ${{ matrix.config }} --target "KisakCOD-mp"
          cmake --build build-${{ matrix.config }} --config ${{ matrix.config }} --target "KisakCOD-dedi"
          popd

      # This native reference job is compile-only. Its inherited bin directory
      # is not a distributable package; browser releases use web-port.yml.
