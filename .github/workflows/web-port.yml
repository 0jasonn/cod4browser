name: Web port synthetic CI

on:
  push:
    branches: [master, web-port, "codex/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 0"

permissions:
  contents: read

concurrency:
  group: web-port-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-portable:
    name: Native portable and trace contract (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check patch whitespace
        run: git diff --check
      - name: Test qualification failure gates
        run: python3 -m unittest discover -s tests -p test_qualified_release.py -v
      - name: Check distributable browser source
        run: |
          mkdir -p build
          git archive --format=zip --output=build/kisakcod-web-source.zip HEAD
          python3 tools/check_source_archive.py build/kisakcod-web-source.zip
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - name: Record host compiler and zlib identity
        run: |
          c++ --version
          dpkg-query -W zlib1g-dev
      - name: Configure portable tests
        run: cmake -S . -B build/portable -G Ninja -DKISAK_PORTABLE_TESTS_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build portable tests
        run: cmake --build build/portable --parallel 2
      - name: Run legal synthetic native suite
        run: ctest --test-dir build/portable --output-on-failure --parallel 2

  parser-fuzz:
    name: Sanitized seeded parser fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install fuzz dependencies
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build zlib1g-dev
      - name: Configure Clang libFuzzer targets
        run: >-
          cmake -S . -B build/fuzz -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DKISAK_PORTABLE_TESTS_ONLY=ON
          -DKISAK_BUILD_FUZZERS=ON
      - name: Build fuzz target
        run: cmake --build build/fuzz --target asset_parsers_fuzz --parallel 2
      - name: Prove sanitizer findings stop execution
        run: ctest --test-dir build/fuzz --output-on-failure -R '^sanitizer_policy$'
      - name: Verify synthetic corpus identity and record compiler
        run: |
          clang++ --version
          python3 tests/fuzz/generate_corpus.py tests/fuzz/corpus
          git diff --exit-code -- tests/fuzz/corpus
      - name: Exercise imported-asset parsers
        env:
          FUZZ_SECONDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '600' || '30' }}
        run: python3 tools/run_asset_fuzz.py build/fuzz/tests/native/asset_parsers_fuzz build/fuzz-run --seconds "$FUZZ_SECONDS"
      - name: Retain synthetic failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-parser-failure
          path: |
            build/fuzz-run/fuzz.log
            build/fuzz-run/failures
          if-no-files-found: error
          retention-days: 7

  windows-portable:
    name: Native portable (Windows MSVC x86)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure portable tests
        run: cmake -S . -B build/portable-windows -A Win32 -DKISAK_PORTABLE_TESTS_ONLY=ON
      - name: Build portable tests
        run: cmake --build build/portable-windows --config Release --parallel 2
      - name: Run legal synthetic Windows suite
        run: ctest --test-dir build/portable-windows -C Release --output-on-failure --parallel 2

  wasm-browser-production:
    name: Wasm differential, Playwright, and production build
    runs-on: windows-2022
    env:
      KISAK_PLAYWRIGHT_WORKERS: 2
      KISAK_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install pinned Emscripten toolchain
        shell: powershell
        run: tools/bootstrap_web_toolchain.ps1
      - name: Install JavaScript dependencies
        run: npm.cmd install --global npm@11.16.0 && npm.cmd ci
      - name: Check JavaScript and protocol types
        run: npm.cmd run check:web:static
      - name: Test protocol validation
        run: npm.cmd run test:protocol
      - name: Build tested production browser target
        shell: powershell
        run: tools/build_web.ps1 -Configuration Release
      - name: Configure Wasm portable differential tests
        shell: powershell
        run: |
          $total = [Diagnostics.Stopwatch]::StartNew()
          $toolchain = Get-Content -Raw tools/web_toolchain.json | ConvertFrom-Json
          $emsdk = Join-Path $env:GITHUB_WORKSPACE '.tools\emsdk'
          $cmake = Join-Path $emsdk "cmake\$($toolchain.cmake)_64bit\bin\cmake.exe"
          $ctest = Join-Path (Split-Path -Parent $cmake) 'ctest.exe'
          $ninja = Join-Path $emsdk "ninja\$($toolchain.ninja)_64bit\ninja.exe"
          $emscripten = Join-Path $emsdk 'upstream\emscripten\cmake\Modules\Platform\Emscripten.cmake'
          $env:EM_CONFIG = Join-Path $emsdk '.emscripten'
          $env:EMSDK = $emsdk
          $step = [Diagnostics.Stopwatch]::StartNew()
          & $cmake -S . -B build/wasm-tests -G Ninja "-DCMAKE_TOOLCHAIN_FILE=$emscripten" "-DCMAKE_MAKE_PROGRAM=$ninja" -DKISAK_PORTABLE_TESTS_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $step.Stop(); Write-Host ("KISAK_TIMING wasm_test_configure_seconds={0:N3}" -f $step.Elapsed.TotalSeconds)
          $step.Restart()
          & $cmake --build build/wasm-tests --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $step.Stop(); Write-Host ("KISAK_TIMING wasm_test_compile_seconds={0:N3}" -f $step.Elapsed.TotalSeconds)
          $step.Restart()
          & $ctest --test-dir build/wasm-tests --output-on-failure --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $step.Stop(); Write-Host ("KISAK_TIMING wasm_test_seconds={0:N3}" -f $step.Elapsed.TotalSeconds)
          $total.Stop(); Write-Host ("KISAK_TIMING wasm_test_total_seconds={0:N3}" -f $total.Elapsed.TotalSeconds)
      - name: Install Chromium
        run: npx.cmd playwright install chromium
      - name: Enforce production artifact boundary
        id: product-boundary
        continue-on-error: true
        run: npm.cmd run check:web:product
      - name: Test production boot and protocol surface
        run: npm.cmd run test:browser:product
      - name: Build diagnostic browser target
        shell: powershell
        run: tools/build_web.ps1 -Configuration Release -Diagnostics
      - name: Run tagged browser smoke suite
        run: npm.cmd run test:browser
      - name: Run non-duplicated browser remainder
        run: npm.cmd run test:browser:remainder
      - name: Record tested artifact sizes
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          Get-ChildItem build/web/site -File | Sort-Object Name | ForEach-Object {
            Write-Host ("KISAK_ARTIFACT {0} bytes={1}" -f $_.Name, $_.Length)
          }
      - name: Require production release gate
        if: ${{ !cancelled() && steps.product-boundary.outcome != 'success' }}
        shell: powershell
        run: throw 'Production artifact boundary failed; see its independent results above.'
      - name: Pair source from this build revision
        run: |
          git archive --format=zip --output=build/kisakcod-web-source.zip HEAD
          python tools/check_source_archive.py build/kisakcod-web-source.zip
      - name: Upload unqualified build inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kisakcod-web-build
          path: |
            build/web/site
            build/web/build-receipt.json
            build/kisakcod-web-source.zip
          if-no-files-found: error
          retention-days: 7

  qualify-package:
    name: Qualify exact source and site after all required tiers
    needs: [native-portable, parser-fuzz, windows-portable, wasm-browser-production]
    if: ${{ !cancelled() && needs.native-portable.result == 'success' && needs.parser-fuzz.result == 'success' && needs.windows-portable.result == 'success' && needs.wasm-browser-production.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kisakcod-web-build
          path: build/qualification-input
      - name: Record this run's required results
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import os,pathlib; pathlib.Path("build/required-results.json").write_text(os.environ["REQUIRED_RESULTS"])'
      - name: Verify and pair tested artifacts
        run: >-
          python3 tools/qualify_web_release.py qualify
          build/qualification-input/web/site
          build/qualification-input/kisakcod-web-source.zip
          build/qualification-input/web/build-receipt.json
          build/required-results.json build/qualified-package
          --revision "${{ github.sha }}"
      - name: Upload synthetic-platform-qualified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kisakcod-web-qualified-source-and-site
          path: build/qualified-package
          if-no-files-found: error
          retention-days: 7
